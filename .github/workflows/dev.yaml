name: "[DEV] Build and Push"
run-name: "[DEV] Build and Push: ${{ github.sha }}"

on:
  push:
    branches:
      - dev

jobs:
  gather-informations:
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        name: Get current date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

  bap-backend:
    needs:
      - gather-informations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: axelnemes/snackquest-dev:backend-${{ needs.gather-informations.outputs.build_time }}-${{ github.sha }}, axelnemes/snackquest-dev:backend-latest
          platforms: linux/arm64, linux/amd64

  bap-frontend:
    needs:
      - gather-informations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: axelnemes/snackquest-dev:frontend-${{ needs.gather-informations.outputs.build_time }}-${{ github.sha }}, axelnemes/snackquest-dev:frontend-latest
          platforms: linux/arm64, linux/amd64
          build-args: |
            REACT_APP_BACKEND_URL=http://dev.snackquest.sb.nemes.live/api
